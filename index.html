<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proyecto</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Proyecto">
  <meta name="theme-color" content="#7D877A">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== ESCENA DE BIENVENIDA ===== -->
  <div id="bienvenida">
    <div id="escena">
      <img id="pika-escena" src="img/pika-walk.png" alt="">
      <div id="globo">¿Eres tú?</div>
    </div>
    <button id="btn-si">Sí</button>
  </div>

  <!-- ===== APP PRINCIPAL ===== -->
  <div id="app">

    <header id="topbar">
      <button id="btn-back" aria-label="Atrás">‹</button>
      <span id="counter"></span>
    </header>

    <main id="screen"></main>

    <footer id="bottom">
      <button id="btn-next">Comenzar →</button>
      <div id="dots"></div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
